<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Events in JavaScript</title>
</head>

<body>
    <button onclick="alert('Button is Clicked')">Click Me!</button>
    <button ondblclick="alert('Button is Clicked 2x')">Double Click Me!</button>
    <div onmouseover="alert('Div is being hovered')" class="box">Hover me!</div>
</body>

</html>
